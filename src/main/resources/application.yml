server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: car-service
              uri: http://car-service:8091
              predicates:
                - Path=/api/cars/**

            - id: user-service
              uri: http://user-service:8092
              predicates:
                - Path=/api/users/**

            - id: user-service-auth
              uri: http://user-service:8092
              predicates:
                - Path=/api/auth/**

            - id: rental-service
              uri: http://rental-service:8093
              predicates:
                - Path=/api/rentals/**